<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sultana Assembly</title>
  <link rel="stylesheet" href="viewer.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <aside id="panel">
    <header>
      <h1>Sultana assembly</h1>
      <div id="meta" class="muted">Loading…</div>
      <div id="checks"></div>
    </header>

    <section>
      <h2>Steps</h2>
      <div class="transport">
        <button id="first" title="Before step 1 (Home)">⏮</button>
        <button id="prev" title="Previous step (←)">◀</button>
        <button id="play" title="Play this step again (Space)">↻</button>
        <button id="next" title="Next step (→)">▶</button>
        <button id="last" title="Fully assembled (End)">⏭</button>
      </div>
      <ol id="steps"></ol>
      <div id="steptext" class="card"></div>
    </section>

    <section>
      <h2>View</h2>
      <label class="row">Explode <input id="explode" type="range" min="0" max="1" step="0.01" value="0"></label>
      <label class="row"><input id="ghost" type="checkbox"> See-through shells</label>
      <label class="row"><input id="showBought" type="checkbox" checked> Bought parts</label>
      <label class="row"><input id="showHardware" type="checkbox" checked> Screws, magnets, bearing</label>
      <label class="row"><input id="autoframe" type="checkbox" checked> Follow the step</label>
      <div class="row">
        Section
        <select id="clipAxis">
          <option value="">off</option>
          <option value="x">side to side (X)</option>
          <option value="y">front to back (Y)</option>
          <option value="z">top to bottom (Z)</option>
        </select>
        <label><input id="clipFlip" type="checkbox"> flip</label>
      </div>
      <input id="clipPos" type="range" min="-45" max="45" step="0.5" value="0" disabled>
      <div class="buttons">
        <button id="frame">Frame</button>
        <button id="isolate" disabled>Isolate selected</button>
        <button id="showAll">Show all</button>
      </div>
    </section>

    <section>
      <h2>Parts</h2>
      <div id="unplaced"></div>
      <div id="parts"></div>
    </section>
  </aside>

  <main id="stage">
    <div id="tooltip"></div>
    <div id="selection" class="card"></div>
    <div id="error" class="card"></div>
  </main>

  <script type="module" src="viewer.js"></script>
</body>
</html>
